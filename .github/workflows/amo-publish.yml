name: Publish Firefox Extension

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Verify Version
        run: cat manifest.json | grep '"version"'

      - name: Build Extension Zip
        run: web-ext build --ignore-files ".git" ".github" "README.md" "PRIVACY.md" "LICENSE" "task.md"

      - name: Sign and Publish to AMO
        run: web-ext sign --api-key=${{ secrets.AMO_JWT_ISSUER }} --api-secret=${{ secrets.AMO_JWT_SECRET }} --channel=listed
