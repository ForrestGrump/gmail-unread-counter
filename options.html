<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gmail Unread Counter — Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div class="options-container">
        <h1>Gmail Unread Counter</h1>
        <p class="subtitle">Extension Settings</p>

        <div class="setting-group">
            <label for="poll-interval">Poll Interval</label>
            <p class="setting-desc">How often to check for new emails.</p>
            <select id="poll-interval">
                <option value="1">Every 1 minute</option>
                <option value="2">Every 2 minutes</option>
                <option value="5">Every 5 minutes</option>
                <option value="10">Every 10 minutes</option>
                <option value="15">Every 15 minutes</option>
                <option value="30">Every 30 minutes</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="account-index">Gmail Account</label>
            <p class="setting-desc">If you have multiple Google accounts, choose which one to monitor (0 =
                first/primary).</p>
            <input type="number" id="account-index" min="0" max="9" value="0">
        </div>

        <div class="setting-group">
            <label class="toggle-label">
                <input type="checkbox" id="notifications-enabled" checked>
                <span class="toggle-text">Desktop Notifications</span>
            </label>
            <p class="setting-desc">Show a desktop notification when new mail arrives.</p>
        </div>

        <div class="actions">
            <button id="btn-save" class="btn btn-primary">Save Settings</button>
            <span id="save-status" class="save-status"></span>
        </div>
    </div>

    <script src="options.js"></script>
</body>

</html>
